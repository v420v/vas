name: Mach-O CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macho:
    runs-on: macos-latest

    steps:
      # V master, built from source: vas tracks the newest compiler. If a V
      # master regression breaks CI, pin temporarily with `git checkout <sha>`
      # before `make`.
      - name: Install V (master)
        run: |
          git clone --depth=1 https://github.com/vlang/v "$RUNNER_TEMP/v"
          make -C "$RUNNER_TEMP/v"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/v/v" version

      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build vas
        run: v .

      - name: Vet
        run: v vet .

      - name: Smoke test (assemble + link + run)
        run: |
          ./vas -f macho examples/macos/hello.s
          clang -arch x86_64 examples/macos/hello.o -o hello.out
          arch -x86_64 ./hello.out

      - name: Mach-O regression suite
        run: v test tests/macho_test.v
