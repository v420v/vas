name: Mach-O CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macho:
    runs-on: macos-latest

    steps:
      - name: Install V
        uses: vlang/setup-v@2c790c60223ed135f6949d1358675e4fd004b801  # v1
        with:
          check-latest: true

      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build vas
        run: v .

      - name: Vet
        run: v vet .

      - name: Smoke test (assemble + link + run)
        run: |
          ./vas -f macho examples/macos/hello.s
          clang -arch x86_64 examples/macos/hello.o -o hello.out
          arch -x86_64 ./hello.out

      - name: Mach-O regression suite
        run: v test tests/macho_test.v
