name: Mach-O CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macho:
    runs-on: macos-latest

    steps:
      # Prebuilt release zip, pinned (see ci-elf.yml for why not setup-v).
      - name: Install V 0.5.2
        run: |
          curl -sSL -o "$RUNNER_TEMP/v.zip" https://github.com/vlang/v/releases/download/0.5.2/v_macos_arm64.zip
          unzip -q "$RUNNER_TEMP/v.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"

      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build vas
        run: v .

      - name: Vet
        run: v vet .

      - name: Smoke test (assemble + link + run)
        run: |
          ./vas -f macho examples/macos/hello.s
          clang -arch x86_64 examples/macos/hello.o -o hello.out
          arch -x86_64 ./hello.out

      - name: Mach-O regression suite
        run: v test tests/macho_test.v
