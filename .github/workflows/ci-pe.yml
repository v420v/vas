name: PE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pe:
    runs-on: ubuntu-latest

    steps:
      # Prebuilt release zip, pinned (see ci-elf.yml for why not setup-v).
      - name: Install V 0.5.2
        run: |
          curl -sSL -o "$RUNNER_TEMP/v.zip" https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          unzip -q "$RUNNER_TEMP/v.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"

      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install MinGW cross-compiler
        run: sudo apt-get install -y mingw-w64

      - name: Build vas
        run: v .

      - name: Vet
        run: v vet .

      - name: Smoke test (assemble + cross-link)
        run: |
          ./vas -f pe examples/windows/hello.s
          x86_64-w64-mingw32-gcc -o hello.exe examples/windows/hello.o

      - name: PE regression suite
        run: v test tests/pe_test.v
