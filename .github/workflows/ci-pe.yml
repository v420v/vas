name: PE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pe:
    runs-on: ubuntu-latest

    steps:
      # V master, built from source: vas tracks the newest compiler. If a V
      # master regression breaks CI, pin temporarily with `git checkout <sha>`
      # before `make`.
      - name: Install V (master)
        run: |
          git clone --depth=1 https://github.com/vlang/v "$RUNNER_TEMP/v"
          make -C "$RUNNER_TEMP/v"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/v/v" version

      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install MinGW cross-compiler
        run: sudo apt-get install -y mingw-w64

      - name: Build vas
        run: v .

      - name: Vet
        run: v vet .

      - name: Smoke test (assemble + cross-link)
        run: |
          ./vas -f pe examples/windows/hello.s
          x86_64-w64-mingw32-gcc -o hello.exe examples/windows/hello.o

      - name: PE regression suite
        run: v test tests/pe_test.v
