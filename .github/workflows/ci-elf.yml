name: ELF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  elf:
    runs-on: ubuntu-latest

    steps:
      # V master, built from source: vas tracks the newest compiler. If a V
      # master regression breaks CI, pin temporarily with `git checkout <sha>`
      # before `make`.
      - name: Install V (master)
        run: |
          git clone --depth=1 https://github.com/vlang/v "$RUNNER_TEMP/v"
          make -C "$RUNNER_TEMP/v"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/v/v" version

      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build vas
        run: v .

      - name: Vet
        run: v vet .

      - name: Smoke test (assemble + link + run)
        run: |
          ./vas main.s -o main.o
          ld -o main main.o
          ./main

      - name: ELF regression suite
        run: v test tests/elf_test.v

      - name: Error regression suite
        run: v test tests/error_test.v

      - name: Verify generator output is committed
        run: |
          v run tools/gen_insns.v
          git diff --exit-code -- encoder/insns_table.gen.v
