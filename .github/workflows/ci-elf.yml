name: ELF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  elf:
    runs-on: ubuntu-latest

    steps:
      # Prebuilt release zip, pinned: compiler and vlib stay in sync and the
      # build is reproducible. vlang/setup-v instead runs `make`, whose
      # bootstrap pulls the newest vc/v.c (V master) and currently panics
      # (EmbedFileData: manual_stdlib_c_headers.h) before compiling anything.
      - name: Install V 0.5.2
        run: |
          curl -sSL -o "$RUNNER_TEMP/v.zip" https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          unzip -q "$RUNNER_TEMP/v.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"

      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build vas
        run: v .

      - name: Vet
        run: v vet .

      - name: Smoke test (assemble + link + run)
        run: |
          ./vas main.s -o main.o
          ld -o main main.o
          ./main

      - name: ELF regression suite
        run: v test tests/elf_test.v

      - name: Error regression suite
        run: v test tests/error_test.v

      - name: Verify generator output is committed
        run: |
          v run tools/gen_insns.v
          git diff --exit-code -- encoder/insns_table.gen.v
